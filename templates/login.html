{% extends "base.html" %}
{% block title %}Login | ThreatScanner{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card auth-card shadow-sm border-0">
            <div class="card-body p-4 p-lg-5">
                <h1 class="h3 mb-2">Welcome</h1>
                <p class="text-secondary mb-4">Sign in to scan files, inspect URLs, and review your security history.</p>
                <form method="post" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" id="email" name="email" type="email" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" id="password" name="password" type="password" placeholder="Enter your password" required>
                    </div>
                    <div class="d-grid">
                        <button class="btn btn-primary btn-lg" type="submit">Login</button>
                    </div>
                </form>
                <p class="mt-4 mb-0 text-secondary">Need an account? <a href="{{ url_for('register') }}">Register here</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
