{% extends "base.html" %}
{% block title %}Register | ThreatScanner{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card auth-card shadow-sm border-0">
            <div class="card-body p-4 p-lg-5">
                <h1 class="h3 mb-2">Create account</h1>
                <p class="text-secondary mb-4">Set up your account to access malware and URL security scans.</p>
                <form method="post" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="username">Username</label>
                            <input class="form-control" id="username" name="username" type="text" placeholder="Your username" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-control" id="email" name="email" type="email" placeholder="you@example.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" id="password" name="password" type="password" placeholder="Minimum 6 characters" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="confirm_password">Confirm Password</label>
                            <input class="form-control" id="confirm_password" name="confirm_password" type="password" placeholder="Repeat your password" required>
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <button class="btn btn-primary btn-lg" type="submit">Create Account</button>
                    </div>
                </form>
                <p class="mt-4 mb-0 text-secondary">Already registered? <a href="{{ url_for('login') }}">Login here</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
